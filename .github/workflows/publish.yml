name: Publish website only

# Republishes the site from the saved job data in a few minutes, without collecting jobs again.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the website from the saved job data
        run: |
          python -c "import json;d=json.load(open('data/jobs.json'));open('site/jobs.js','w').write('window.JOBS_DATA = '+json.dumps(d,ensure_ascii=False,separators=(',',':'))+';\n')"
          python -m pip install --quiet pillow
          python -m collector.pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear a stuck earlier publish, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=6" --jq '.[].sha' | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelled stuck publish $sha" || true
          done
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
