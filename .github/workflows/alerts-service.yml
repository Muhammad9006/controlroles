name: Job alert sign-up service

# Publishes worker/alerts.js to Cloudflare at https://api.controlroles.com (free plan).
# Needs the repository secrets CLOUDFLARE_API_TOKEN and RESEND_API_KEY.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/alerts-service.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the keys are there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN and RESEND_API_KEY secrets first (Settings → Secrets and variables → Actions)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: "20"

      - name: Find the account and the subscriber store (create it the first time)
        if: env.SKIP != '1'
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          ACC=$(api https://api.cloudflare.com/client/v4/accounts | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['result'][0]['id']) if r.get('result') else sys.exit('Cloudflare key problem: %s' % r.get('errors'))")
          NS=$(api "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" | python3 -c "import sys,json; print(next((n['id'] for n in json.load(sys.stdin)['result'] if n['title']=='controlroles-subs'),''))")
          if [ -z "$NS" ]; then
            NS=$(api -X POST "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" -d '{"title":"controlroles-subs"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
            echo "Created the subscriber store."
          fi
          cat > wrangler.toml <<TOML
          name = "controlroles-alerts"
          main = "worker/alerts.js"
          compatibility_date = "2025-06-01"
          account_id = "$ACC"
          workers_dev = false
          routes = [ { pattern = "api.controlroles.com", custom_domain = true } ]
          [[kv_namespaces]]
          binding = "SUBS"
          id = "$NS"
          TOML
          sed -i 's/^          //' wrangler.toml

      - name: Publish the sign-up service
        if: env.SKIP != '1'
        run: npx --yes wrangler@4.20.0 deploy

      - name: Give it the email key
        if: env.SKIP != '1'
        run: printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.20.0 secret put RESEND_API_KEY

      - name: Check it answers
        if: env.SKIP != '1'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS -H "Origin: https://controlroles.com" https://api.controlroles.com/subscribe || true)
            echo "attempt $i: $code"; [ "$code" = "204" ] && exit 0; sleep 20
          done
          echo "::warning::api.controlroles.com isn't answering yet (new domains can take a few minutes)."
