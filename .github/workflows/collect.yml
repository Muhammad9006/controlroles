name: Collect jobs

on:
  schedule:
    - cron: "17 3,15 * * *"   # twice a day: 06:17 and 18:17 Riyadh time
  workflow_dispatch: {}        # "Run workflow" button for a manual run
  push:                        # publish website changes straight away
    branches: [main]
    paths: ["site/index.html", "site/CNAME", "employers.json", "collector/**", "manual_jobs.csv", "settings.json"]

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests

      - name: Collect jobs from employer career sites
        run: python -m collector.run || echo "::warning::No employer could be read this run; publishing the last good data."

      - name: Build a page for every job (for Google and sharing)
        run: python -m collector.pages

      - name: Send job alert emails
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m collector.alerts || echo "::warning::Job alert emails could not be sent this run."

      - name: Show run report
        if: always()
        run: cat data/run-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save collected data
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
            if git pull --rebase --autostash; then
              git push || echo "::warning::Could not save data to the repository; the website is still published."
            else
              git rebase --abort || true
              echo "::warning::Could not merge with newer changes; data not saved this run, the website is still published."
            fi
          fi

      - name: Make sure the website data file exists
        if: always()
        run: test -f site/jobs.js || python -c "import json;d=json.load(open('data/jobs.json'));open('site/jobs.js','w').write('window.JOBS_DATA = '+json.dumps(d,ensure_ascii=False,separators=(',',':'))+';\\n')"

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # GitHub sometimes takes over 10 minutes to publish thousands of job pages
